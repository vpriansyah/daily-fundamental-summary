name: Daily IDX Stock Summary

on:
  schedule:
    # Jalan tiap hari kerja (Senin-Jumat) jam 01:00 UTC = 08:00 WIB
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    # Untuk trigger manual dari GitHub UI

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t idx-daily-summary .

      - name: Run daily summary (Docker)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p audit_data
          docker run --rm \
            -e GEMINI_API_KEY \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            -v ${{ github.workspace }}/audit_data:/app/audit_data \
            idx-daily-summary

      - name: Upload audit data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-data-${{ github.run_number }}
          path: audit_data/
          retention-days: 7
          if-no-files-found: ignore
